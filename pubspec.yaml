name: solace
description: "A private, judgment-free space for mental health support — therapist bookings, community circles, and secure chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  google_sign_in: ^7.2.0

  # Local storage
  shared_preferences: ^2.2.3

  # Maps
  google_maps_flutter: ^2.6.1

  # UI / formatting utilities
  intl: ^0.20.3
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  url_launcher: ^6.2.6

  # Audio calls
  agora_rtc_engine: ^6.2.2
  permission_handler: ^13.0.0
  flutter_ringtone_player: ^4.0.0+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.3
  fake_cloud_firestore: ^4.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
